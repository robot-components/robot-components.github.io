name: Supabase Keep-Alive

# 무료 플랜 Supabase 프로젝트는 7일간 API 요청이 없으면 자동 정지된다.
# 2일마다 실제 DB 조회를 1회 보내 "활동 중" 상태를 유지한다.
on:
  schedule:
    - cron: "0 3 */2 * *"   # 2일마다 03:00 UTC (= 12:00 KST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # URL / anon 키는 src/lib/supabase.js 와 동일한 공개 값이다.
        # 키를 교체하면 이 파일도 함께 수정해야 한다.
        env:
          SUPABASE_URL: https://srgpmgjzqaqddlcfebxu.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyZ3BtZ2p6cWFxZGRsY2ZlYnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NDgxNjIsImV4cCI6MjA5NTQyNDE2Mn0.xvaXQ075ZQz__zxZQbNJSLBWBsix9yN-cEMqBuSb85M
        run: |
          code=$(curl -sS -m 30 -o /tmp/ping.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/ping.json
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping 실패 (HTTP $code) — 프로젝트가 정지되었을 수 있습니다."
            exit 1
          fi
          echo "Supabase 정상 응답."
